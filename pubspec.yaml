  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  google_fonts: ^8.1.0
  image_picker: ^1.2.0
  intl: any
  json_annotation: ^4.12.0
  mask_text_input_formatter: ^2.9.0
  meta: ^1.17.0
  package_info_plus: ^10.1.0

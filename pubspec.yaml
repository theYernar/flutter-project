dependencies:
  auto_route: ^11.1.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  clock: ^1.1.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:

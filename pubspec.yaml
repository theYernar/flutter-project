  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  auto_route_generator: ^10.5.0
  bloc_lint: ^0.4.0
  build_runner: ^2.13.1
  flutter_gen_runner: ^5.13.0+1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  lint: ^2.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
